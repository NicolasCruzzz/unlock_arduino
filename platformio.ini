; Étape 1: Collez le code de base .ini
[platformio]
; Tell PIO to treat this folder (containing .ino) as the source directory
src_dir = .

; Étape 2: Ajout des configuration du Arduino Nano R4
[env:nano_r4]
platform = renesas-ra
board = nano_r4
framework = arduino
monitor_speed = 115200

; Étape 3: Ajout des bibliothèques
lib_deps =
    https://github.com/thomasfredericks/MicroOsc.git
    https://github.com/thomasfredericks/Bounce2.git
    https://github.com/SofaPirate/Chrono.git
